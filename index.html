<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>Sand Puzzle</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        body {
            background-color: #0d0f12;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            height: 100vh;
            height: 100dvh;
            padding-bottom: 60px;
        }
        #ui-container {
            display: flex;
            gap: 20px;
            font-size: 16px;
            font-weight: bold;
            z-index: 10;
            background: rgba(0, 0, 0, 0.6);
            padding: 6px 16px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            margin-top: 10px;
        }
        #canvas-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            position: relative;
            overflow: hidden;
        }
        canvas {
            display: block;
            background: #090b0e;
        }
        #bottom-panel {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background: #12161c;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 10;
        }
        #ink-bar-container {
            width: 80%;
            max-width: 250px;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.2);
            margin-bottom: 4px;
        }
        #ink-bar {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #00f2fe, #4facfe);
            transition: width 0.1s linear;
        }
        .ad-placeholder {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.4);
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div id="ui-container">
        <div>점수: <span id="score">0</span></div>
        <div>콤보: <span id="combo">0</span></div>
    </div>

    <div id="canvas-container">
        <canvas id="canvas"></canvas>
    </div>

    <div id="bottom-panel">
        <div id="ink-bar-container">
            <div id="ink-bar"></div>
        </div>
        <div class="ad-placeholder">ADVERTISEMENT BANNER SPACE</div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('canvas-container');
        const scoreEl = document.getElementById('score');
        const comboEl = document.getElementById('combo');
        const inkBarEl = document.getElementById('ink-bar');

        function resizeCanvas() {
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let score = 0;
        let combo = 0;
        let ink = 100;
        const maxInk = 100;

        // 색상 3가지 (빨강, 파랑, 초록)
        const COLORS = [
            { id: 0, name: 'RED', hex: '#ff4757' },
            { id: 1, name: 'BLUE', hex: '#1e90ff' },
            { id: 2, name: 'GREEN', hex: '#2ed573' }
        ];

        let sands = [];
        let lines = [];
        let particles = [];

        class Sand {
            constructor(x, y, colorObj) {
                this.x = x;
                this.y = y;
                this.radius = 10; // 🟢 공 크기를 큼직하게 키움 (지름 20px)
                this.colorObj = colorObj;
                this.vx = 0;
                this.vy = 2;
                this.isSettled = false;
            }

            update() {
                if (this.isSettled) return;

                this.vy += 0.25; // 중력
                this.x += this.vx;
                this.y += this.vy;

                // 🟢 바닥 충돌 수정 (밑에 박히지 않고 딱 맞아떨어지게 처리)
                if (this.y + this.radius >= canvas.height) {
                    this.y = canvas.height - this.radius;
                    this.vy = 0;
                    this.vx = 0;
                    this.isSettled = true;
                    return;
                }

                // 좌우 벽 충돌
                if (this.x - this.radius <= 0) {
                    this.x = this.radius;
                    this.vx = 0;
                } else if (this.x + this.radius >= canvas.width) {
                    this.x = canvas.width - this.radius;
                    this.vx = 0;
                }

                // 선과의 충돌 처리 (거꾸로 올라가는 현상 원천 차단)
                for (let line of lines) {
                    for (let i = 0; i < line.length - 1; i++) {
                        const p1 = line[i];
                        const p2 = line[i + 1];
                        const dist = pointToSegmentDistance(this.x, this.y, p1.x, p1.y, p2.x, p2.y);
                        
                        if (dist < this.radius + 3) {
                            this.vy = 0; // 아래로 떨어지는 힘 제거
                            this.vx = 0;
                            this.y = p1.y - this.radius; // 선 위에 정확히 안착
                            this.isSettled = true;
                        }
                    }
                }
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.colorObj.hex;
                ctx.fill();
                ctx.closePath();
            }
        }

        class Particle {
            constructor(x, y, colorHex) {
                this.x = x;
                this.y = y;
                this.radius = Math.random() * 4 + 2;
                this.color = colorHex;
                this.vx = (Math.random() - 0.5) * 6;
                this.vy = (Math.random() - 0.5) * 6;
                this.alpha = 1;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.alpha -= 0.04;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.alpha);
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.restore();
            }
        }

        function pointToSegmentDistance(px, py, x1, y1, x2, y2) {
            const l2 = (x2 - x1) ** 2 + (y2 - y1) ** 2;
            if (l2 === 0) return Math.hypot(px - x1, py - y1);
            let t = ((px - x1) * (x2 - x1) + (py - y1) * (y2 - y1)) / l2;
            t = Math.max(0, Math.min(1, t));
            return Math.hypot(px - (x1 + t * (x2 - x1)), py - (y1 + t * (y2 - y1)));
        }

        // 큰 공 크기에 맞춰 생성 개수와 최대 수량 조절 (최대 60개)
        function spawnSand() {
            if (Math.random() < 0.08 && sands.length < 60) {
                const randomX = Math.random() * (canvas.width - 60) + 30;
                const randomColor = COLORS[Math.floor(Math.random() * COLORS.length)];
                sands.push(new Sand(randomX, 10, randomColor));
            }
        }

        // 🟢 공끼리 절대 겹치지 않도록 밀어내는 충돌 처리
        function resolveSandCollisions() {
            const minDist = 20; // 지름 (10 * 2)
            for (let i = 0; i < sands.length; i++) {
                for (let j = i + 1; j < sands.length; j++) {
                    const s1 = sands[i];
                    const s2 = sands[j];
                    const dx = s2.x - s1.x;
                    const dy = s2.y - s1.y;
                    const dist = Math.hypot(dx, dy);

                    if (dist < minDist && dist > 0) {
                        const overlap = (minDist - dist) / 2;
                        const nx = dx / dist;
                        const ny = dy / dist;

                        s1.x -= nx * overlap;
                        s1.y -= ny * overlap;
                        s2.x += nx * overlap;
                        s2.y += ny * overlap;

                        if (ny > 0.4) {
                            s1.isSettled = true;
                            s2.isSettled = true;
                        }
                    }
                }
            }
        }

        function checkGroups() {
            const visited = new Set();
            const thresholdDistance = 24; // 🟢 큰 공 사이즈에 맞춰 그룹 감지 거리도 넉넉하게 확장

            for (let i = 0; i < sands.length; i++) {
                if (visited.has(i)) continue;

                const group = [i];
                const queue = [i];
                visited.add(i);

                const currentColorId = sands[i].colorObj.id;

                while (queue.length > 0) {
                    const currIdx = queue.shift();
                    const currSand = sands[currIdx];

                    for (let j = 0; j < sands.length; j++) {
                        if (visited.has(j)) continue;

                        if (sands[j].colorObj.id === currentColorId) {
                            const dist = Math.hypot(currSand.x - sands[j].x, currSand.y - sands[j].y);
                            if (dist <= thresholdDistance) {
                                visited.add(j);
                                group.push(j);
                                queue.push(j);
                            }
                        }
                    }
                }

                if (group.length >= 5) {
                    explodeGroup(group);
                    break;
                }
            }
        }

        function explodeGroup(groupIndices) {
            groupIndices.sort((a, b) => b - a);

            combo++;
            score += groupIndices.length * 10 * combo;
            scoreEl.textContent = score;
            comboEl.textContent = combo;

            groupIndices.forEach(idx => {
                const target = sands[idx];
                for (let k = 0; k < 8; k++) {
                    particles.push(new Particle(target.x, target.y, target.colorObj.hex));
                }
                sands.splice(idx, 1);
            });

            // 터진 후 주변 공들 다시 떨어지게 깨우기
            sands.forEach(s => s.isSettled = false);

            ink = Math.min(maxInk, ink + 15);
        }

        let isDrawing = false;
        let currentLine = [];

        function getEventPos(e) {
            const rect = canvas.getBoundingClientRect();
            return {
                x: e.clientX - rect.left,
                y: e.clientY - rect.top
            };
        }

        function startDraw(pos) {
            if (ink > 5 && pos.y >= 0 && pos.y <= canvas.height - 60) {
                isDrawing = true;
                currentLine = [pos];
                lines.push(currentLine);
            }
        }

        function moveDraw(pos) {
            if (!isDrawing) return;
            if (ink <= 0) {
                isDrawing = false;
                return;
            }

            currentLine.push(pos);
            ink -= 0.35;
            inkBarEl.style.width = `${Math.max(0, ink)}%`;
        }

        function endDraw() {
            isDrawing = false;
        }

        canvas.addEventListener('mousedown', (e) => startDraw(getEventPos(e)));
        canvas.addEventListener('mousemove', (e) => moveDraw(getEventPos(e)));
        canvas.addEventListener('mouseup', endDraw);

        canvas.addEventListener('touchstart', (e) => {
            startDraw(getEventPos(e.touches[0]));
        });
        canvas.addEventListener('touchmove', (e) => {
            moveDraw(getEventPos(e.touches[0]));
        });
        canvas.addEventListener('touchend', endDraw);

        setInterval(() => {
            if (!isDrawing && ink < maxInk) {
                ink = Math.min(maxInk, ink + 1);
                inkBarEl.style.width = `${ink}%`;
            }
        }, 200);

        function loop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            spawnSand();

            sands.forEach(sand => sand.update());
            resolveSandCollisions(); // 겹침 방지

            sands.forEach(sand => sand.draw());

            checkGroups();

            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 3;
            ctx.lineCap = 'round';
            lines.forEach(line => {
                if (line.length < 2) return;
                ctx.beginPath();
                ctx.moveTo(line[0].x, line[0].y);
                for (let i = 1; i < line.length; i++) {
                    ctx.lineTo(line[i].x, line[i].y);
                }
                ctx.stroke();
            });

            if (lines.length > 5) {
                lines.shift();
            }

            particles.forEach((p, idx) => {
                p.update();
                p.draw();
                if (p.alpha <= 0) particles.splice(idx, 1);
            });

            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
